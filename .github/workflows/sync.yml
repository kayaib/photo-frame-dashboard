name: Sync Calendar, Shopping List & Car

on:
  schedule:
    - cron: '0 * * * *'  # every hour
  workflow_dispatch:       # allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ── TimeTree calendar ──────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install timetree-exporter
        run: pip install timetree-exporter

      - name: Export calendar
        env:
          TIMETREE_EMAIL: ${{ secrets.TIMETREE_EMAIL }}
          TIMETREE_PASSWORD: ${{ secrets.TIMETREE_PASSWORD }}
        run: |
          timetree-exporter \
            -c GYCFb6Y5TbY2 \
            -o calendar.ics

      # ── Bring shopping list ────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bring dependencies
        run: npm install --prefix scripts

      - name: Sync Bring list
        env:
          BRING_EMAIL: ${{ secrets.BRING_EMAIL }}
          BRING_PASSWORD: ${{ secrets.BRING_PASSWORD }}
        run: node scripts/sync-bring.js

      # ── Audi Q4 e-tron ────────────────────────────────────────
      - name: Clone myaudi-api
        run: git clone --depth 1 https://github.com/John6810/myaudi-api.git /tmp/myaudi-api

      - name: Install myaudi-api requirements
        run: pip install -r /tmp/myaudi-api/requirements.txt

      - name: Sync Audi status
        env:
          AUDI_USERNAME: ${{ secrets.AUDI_USERNAME }}
          AUDI_PASSWORD: ${{ secrets.AUDI_PASSWORD }}
          AUDI_COUNTRY: DE
          AUDI_SPIN: ${{ secrets.AUDI_SPIN }}
          AUDI_TOKEN_KEY: ${{ secrets.AUDI_TOKEN_KEY }}
          MYAUDI_API_PATH: /tmp/myaudi-api
        run: python scripts/sync-audi.py

      # ── Commit all changes ────────────────────────────────────
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar.ics bring.json audi.json audi_tokens.enc
          git diff --cached --quiet || git commit -m "sync: update calendar, shopping list and car status"
          git push
